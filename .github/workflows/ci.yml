name: CI

on:
  push:
    branches: [main, v1]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Tag or commit to build with this workflow and publish to GitHub Pages (for back-filling
          versions made before versioned deploys existed). Leave empty for a plain CI run.
        required: false
        default: ''
      folder:
        description: Folder to publish under (defaults to the ref, e.g. v0.1.0)
        required: false
        default: ''

permissions:
  contents: read

# Only pull requests cancel superseded runs; pushes and dispatches each run to the end (a run on
# main or a tag may be part-way through publishing to gh-pages).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + headless level tests
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright smoke
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  # Publish to one folder of the gh-pages branch (main/, a v* tag, or a back-filled ref), keeping
  # every other version, and regenerate the root switcher.json and index.html.
  # Pages serves the branch: Settings -> Pages -> Deploy from a branch -> gh-pages / (root).
  deploy:
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
      || (github.event_name == 'workflow_dispatch' && inputs.ref != '')
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One queue per folder, never cancelled; publish-pages.sh retries if another folder's deploy
    # pushed to gh-pages first.
    concurrency:
      group: pages-${{ inputs.folder || inputs.ref || github.ref_name }}
      cancel-in-progress: false
    env:
      FOLDER: ${{ inputs.folder || inputs.ref || github.ref_name }}
    steps:
      # This workflow's own commit, for the publish scripts and push credentials.
      - uses: actions/checkout@v4
      # The commit to publish (differs from the above only for a back-fill dispatch).
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: build
        run: |
          npm ci
          sha=$(git rev-parse --short HEAD)
          if [ "$FOLDER" = main ]; then version="main-$sha"; else version="$FOLDER"; fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          # --base ./ so older refs (built for a fixed /bot-areana/ base) also work from a subfolder.
          APP_VERSION="$version" npx vite build --base ./
      - name: Publish to gh-pages
        run: >-
          scripts/publish-pages.sh "$FOLDER" build/dist
          "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
